<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Responsive Flipping Cards</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        .card-container {
            perspective: 1000px;
            z-index: 1;
        }

        .flip-card {
            position: relative;
            width: 100%;
            height: 300px;
            perspective: 1000px;
            transform-style: preserve-3d;
        }

        .flip-card-inner {
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            position: relative;
            transform: translateZ(0);
        }

        /* Remove this rotation, since we do fade now */
        /* .flipped .flip-card-inner {
            transform: rotateY(180deg);
        } */

        .flip-card-front,
        .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            -moz-backface-visibility: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            overflow: hidden;
            /* Add fade transition and pointer-events control */
            opacity: 1;
            pointer-events: auto;
            transition: opacity 0.5s ease;
        }

        .flip-card-front {
            background-color: #f8f9fa;
            z-index: 2;
            display: flex; /* always flex */
        }

        .flip-card-back {
            background-color: #0d6efd;
            color: white;
            transform: rotateY(180deg); /* keep this for consistent style */
            z-index: 1;
            display: flex; /* always flex */
            opacity: 0; /* start hidden */
            pointer-events: none;
        }

        /* Remove instant display toggling in CSS */
        /* .flipped .flip-card-front {
            display: none !important;
        }
        .flipped .flip-card-back {
            display: flex !important;
        } */

        .album-art {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
        }

        .image-header {
            display: block;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            height: auto;
            max-height: 600px;
            position: relative;
            z-index: 0;
        }

        .container {
            margin-top: -150px;
            position: relative;
            z-index: 1;
            padding-top: 200px;
        }
    </style>
</head>

                            </div>
