<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Responsive Flipping Cards</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card-container {
            perspective: 1000px;
            z-index: 1;
        }

        .flip-card {
            position: relative;
            width: 100%;
            height: 300px;
            perspective: 1000px;
            transform-style: preserve-3d;
        }

        .flip-card-inner {
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            position: relative;
            transform: translateZ(0);
        }

        .flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front,
        .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            -moz-backface-visibility: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            overflow: hidden;
        }

        .flip-card-front {
            background-color: #f8f9fa;
            z-index: 2;
            display: flex;
        }

        .flip-card-back {
            background-color: #0d6efd;
            color: white;
            transform: rotateY(180deg);
            z-index: 1;
            display: none;
        }

        .flipped .flip-card-front {
            display: none !important; /* hide front */
        }

        .flipped .flip-card-back {
            display: flex !important; /* show back */
        }

        .album-art {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
        }

        .image-header {
            display: block;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            height: auto;
            max-height: 600px;
            position: relative;
            z-index: 0;
        }

        .container {
            margin-top: -150px;
            position: relative;
            z-index: 1;
            padding-top: 200px;
        }
    </style>
</head>
<body>
    <img class="image-header" src="src/music/bugchaser-banner.png" alt="Header Image">

    <div class="container py-5">
        <div class="row g-4">
            <!-- fmbld EP 1 -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card-container" onclick="handleCardClick(event, this)">
                    <div class="flip-card">
                        <div class="flip-card-inner">
                            <div class="flip-card-front">
                                <img class="album-art" src="src/music/fmbled1.png" />
                            </div>
                            <div class="flip-card-back">
                                <iframe width="100%" height="300" scrolling="no" frameborder="no" allow="autoplay"
                                        src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/playlists/1874120342&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=true"></iframe>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- fmbld EP 2 -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card-container" onclick="handleCardClick(event, this)">
                    <div class="flip-card">
                        <div class="flip-card-inner">
                            <div class="flip-card-front">
                                <img class="album-art" src="src/music/fmbled2.png" />
                            </div>
                            <div class="flip-card-back">
                                <iframe width="100%" height="300" scrolling="no" frameborder="no" allow="autoplay"
                                        src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/playlists/2005433848&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=true"></iframe>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card-container" onclick="handleCardClick(event, this)">
                    <div class="flip-card">
                        <div class="flip-card-inner">
                            <div class="flip-card-front">
                                Click to Flip (Front 3)
                            </div>
                            <div class="flip-card-back">
                                Back Content 3
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleCardClick(event, container) {
            const frontFace = container.querySelector('.flip-card-front');
            if (!frontFace.contains(event.target)) return;

            // Close all other cards
            document.querySelectorAll('.flip-card-inner').forEach(inner => {
                inner.parentElement.parentElement.classList.remove('flipped');
            });

            // Toggle this card
            container.classList.toggle('flipped');
        }
    </script>

</body>
</html>
