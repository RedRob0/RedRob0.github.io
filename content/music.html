<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fumbled a BBW</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <style>
        .card-container {
            perspective: 1000px;
            margin-bottom: 30px;
            cursor: pointer;
        }

        .flip-card {
            width: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .flip-card::before {
            content: "";
            display: block;
            padding-top: 100%;
        }

        .flipped {
            transform: rotateY(180deg);
        }

        .flip-card-front,
        .flip-card-back {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            backface-visibility: hidden;
            border-radius: 0.25rem;
            overflow: hidden;
        }

        .flip-card-front {
            background-color: #fff;
            z-index: 2;
        }

        .flip-card-back {
            background-color: #f8f9fa;
            transform: rotateY(180deg);
        }

        .flip-card:not(.flipped) .flip-card-back {
            opacity: 0;
            pointer-events: none;
        }

        .flip-card.flipped .flip-card-front {
            opacity: 0;
            pointer-events: none;
        }

        .flip-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        iframe.thin-slice {
            height: 120px;
        }

        .shadow-sm {
            box-shadow: 0 0.25rem 0.5rem rgba(0, 0, 0, 0.1);
        }

        .card-group {
            position: relative;
        }

        .header-image {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
        }

        .header-image img {
            width: 50%;
            height: auto;
            display: block;
        }

        .card-group-section .container {
            position: relative;
            margin-top: -10%;
            z-index: 2;
        }

        p.feature-text {
            font-size: 70%;
            margin-top: 20px;
            margin-bottom: 0px;
        }
    </style>
</head>
<body>
    <div class="card-group-section position-relative my-5">
        <!-- Background Header Image -->
        <div class="header-image">
            <img id="bugchaser-banner" src="src/music/bugchaser-banner.png" alt="Fumbled A BBW Series Header">
        </div>

        <div class="container py-5">
            <!-- top row -->
            <div class="row">
                <!-- Fmbld EP 1 -->
                <div class="col-md-6">
                    <div class="card-container shadow-sm" onclick="flipCard(this)">
                        <div class="flip-card">
                            <div class="flip-card-front">
                                <img src="src/music/fmbld1.png" alt="The Fumbled a BBW EP PROD. OXXY">
                            </div>
                            <div class="flip-card-back">
                                <iframe scrolling="no" frameborder="no" allow="autoplay" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/playlists/1874120342&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=true"></iframe>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Fmbld EP 2 -->
                <div class="col-md-6">
                    <div class="card-container shadow-sm" onclick="flipCard(this)">
                        <div class="flip-card">
                            <div class="flip-card-front">
                                <img src="src/music/fmbld2.png" alt="Fumbled a BBW EP 2: Songs for Lovers & Shooters Alike">
                            </div>
                            <div class="flip-card-back">
                                <iframe width="100%" height="300" scrolling="no" frameborder="no" allow="autoplay" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/playlists/soundcloud%253Aplaylists%253A2005433848&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=true"></iframe>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- bottom row -->
            <div class="row">
                <!-- Fmbld Track a Week Summer 25-->
                <div class="col-md-6">
                    <div class="card-container shadow-sm" onclick="flipCard(this)">
                        <div class="flip-card">
                            <div class="flip-card-front">
                                <img src="src/music/fmbldTrackAWeek.png" alt="Track a Week 2025">
                            </div>
                            <div class="flip-card-back">
                                <iframe width="560" height="315" src="https://www.youtube.com/embed/videoseries?si=YYO5UL1XHYU6k9nb&amp;list=PLV3HwjMvRGG4__fw_uwhVABGGVvmTwUNs" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Fumbled Features -->
                <div class="col-md-6">
                    <div class="card-container shadow-sm" onclick="flipCard(this)">
                        <div class="flip-card">
                            <div class="flip-card-front">
                                <img src="src/music/fmbldFeatures.png" alt="Track a Week 2025">
                            </div>
                            <div class="flip-card-back"> <!-- This breaks on mobile, the bottom features aren't visible -->
                                <p class='feature-text'>Fumbled a BBW as DJ BATTERYMAN with lyrics and vocals on DJ ARCHFIEND's THE BACKROW EP</p>
                                <iframe style="border: 0; width: 100%; height: 120px;" src="https://bandcamp.com/EmbeddedPlayer/album=1840132612/size=large/bgcol=333333/linkcol=e32c14/tracklist=false/artwork=small/track=3972504994/transparent=true/" seamless><a href="https://djarchfiend.bandcamp.com/album/the-backrow-ep">THE BACKROW EP by DJ ARCHFIEND</a></iframe>
                                <p class='feature-text'>Fumbled a BBW as Bosch Eggman with additional vocals on DJ ARCHFIEND's DREAD JESTER (SKYLIVE 2025)</p>
                                <iframe style="border: 0; width: 100%; height: 120px;" src="https://bandcamp.com/EmbeddedPlayer/album=822325780/size=large/bgcol=333333/linkcol=0f91ff/tracklist=false/artwork=small/track=227534481/transparent=true/" seamless><a href="https://djarchfiend.bandcamp.com/album/dread-jester-skylive-2025">DREAD JESTER (SKYLIVE 2025) by DJ ARCHFIEND</a></iframe>
                                <p class='feature-text'>Fumbled a BBW lyrics & vocals on Haiipara's Dump EP</p>
                                <iframe class="thin-slice" width="100%" scrolling="no" frameborder="no" allow="autoplay" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A2077989148&color=%23ec4494&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=true"></iframe><div style="font-size: 10px; color: #cccccc;line-break: anywhere;word-break: normal;overflow: hidden;white-space: nowrap;text-overflow: ellipsis; font-family: Interstate,Lucida Grande,Lucida Sans Unicode,Lucida Sans,Garuda,Verdana,Tahoma,sans-serif;font-weight: 100;"><a href="https://soundcloud.com/haiipara" title="haiipara" target="_blank" style="color: #cccccc; text-decoration: none;">haiipara</a> · <a href="https://soundcloud.com/haiipara/throw-dat-flick-dat-feat-fumbled-a-bbw-3" title="throw dat flick dat (feat. Fumbled A BBW)" target="_blank" style="color: #cccccc; text-decoration: none;">throw dat flick dat (feat. Fumbled A BBW)</a></div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Bandcamp Link Bar -->
                <button onclick="document.location='https://fumbledabbw.bandcamp.com/'">Support Fumbled</button>
            </div>
        </div>
    </div>
        <script>
            function resetCards() {
                // Reset all cards
                document.querySelectorAll('.flip-card').forEach(card => {
                    card.classList.remove('flipped');
                });
            }

            function flipCard(clickedContainer) {
                resetCards();

                // Flip the clicked card
                const flip = clickedContainer.querySelector('.flip-card');
                flip.classList.add('flipped');
            }

            document.getElementById("bugchaser-banner").addEventListener("click", resetCards)
        </script>
</body>
</html>
