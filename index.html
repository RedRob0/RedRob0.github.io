<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORK IN PROGRESS</title>
    <link rel="stylesheet" href="css/stylesheet.css">
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="js/navigation.js"></script>
    <style>

        body {
            margin: 0;
            overflow: hidden;
        }

        /* Scrolling tiles background */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            image-rendering: pixelated;
        }

        /* Sidebar overlay */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 200px;
            height: 100vh;
            z-index: 1000;
            transform: translateX(0);
            transition: transform 0.3s ease;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.2);
            padding-top: 3rem; /* enough room for the tab */
            pointer-events: auto;
        }

            /* Hidden state */
            .sidebar.hidden {
                transform: translateX(-180px);
            }

        /* Main content stays full width */
        main {
            margin-left: 0;
        }

        /* Vertical-Navbar tab (the little handle dingle) */
        .sidebar-tab {
            position: fixed;
            top: 0;
            left: 200px; /* matches sidebar width */
            display: inline-flex;
            align-items: center;
            padding: 0.5rem 0.75rem;
            background: #f8f9fa;
            font-weight: bold;
            cursor: pointer;
            border-radius: 0 0 6px 0;
            box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.2);
            white-space: nowrap;
            z-index: 1100;
            transition: left 0.3s ease;
            pointer-events: auto;
        }

            .sidebar.hidden + .sidebar-tab,
            .sidebar-tab.hidden {
                left: 20px; /* stays visible */
            }
    </style>
</head>
<body>
    <!-- Scrolling Background -->
    <canvas id="bgCanvas"></canvas>

    <div class="d-flex" style="min-height: 100vh;">
        <!-- Vertical Navbar / sidebar -->
        <div class="sidebar-tab" id="sidebarTab">☰</div>
        <nav id="sidebar" class="sidebar bg-light p-3">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" href="#" id="landing">Home</a> <!-- make this like a centered icon at the top -->
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" id="music">Music</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" id="video">Video</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" id="links">Socials</a>
                </li>
            </ul>
        </nav>

        <!-- Main Content Area -->
        <main class=" p-3">
            <div id="content">
                <h3>Placeholder Landing page</h3> <br /> this website is an informal compilation of projects
            </div>
        </main>
    </div>

    <!-- Bootstrap JS, Popper.js, and jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <!-- Background Tiling + Scrolling -->
    <script>
        const canvas = document.getElementById("bgCanvas");
        const ctx = canvas.getContext("2d");

        // Tile size
        const tileWidth = 426;
        const tileHeight = 540;

        // Scroll speed (pixels per frame)
        const speedX = 1;  // leftwards
        const speedY = 1;  // downwards

        let offsetX = 0;
        let offsetY = 0;

        // Resize canvas to fill viewport
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Load tile image
        const tile = new Image();
        tile.src = "src/img/cry.png";

        // Draw tiles
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Calculate starting positions for tiling
            const startX = -tileWidth + (offsetX % tileWidth);
            const startY = -tileHeight + (offsetY % tileHeight);

            // Draw the repeated tiles
            for (let x = startX; x < canvas.width; x += tileWidth) {
                for (let y = startY; y < canvas.height; y += tileHeight) {
                    ctx.drawImage(tile, x, y, tileWidth, tileHeight);
                }
            }

            // Update offsets
            offsetX -= speedX;
            offsetY += speedY;

            requestAnimationFrame(draw);
        }

        // Start drawing after image loads
        tile.onload = draw;
    </script>
</body>
</html>
